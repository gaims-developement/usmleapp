# Railway deployment configuration for the USMLE App backend.
#
# IMPORTANT: Any Railway service deployed from this repository will run the
# Express API (backend/src/server.js), NOT the frontend. The frontend is
# deployed separately to Netlify.
#
# Required Railway environment variables:
#   - DATABASE_URL            e.g. mysql://user:pass@host:3306/usmle_app  (MySQL 8 / Aiven MySQL)
#   - JWT_SECRET              at least 32 chars
#   - JWT_REFRESH_SECRET      at least 32 chars, different from JWT_SECRET
#   - PORT                    (Railway provides this automatically)
#   - NODE_ENV=production
#   - CLIENT_URL              https://<your-netlify-site>.netlify.app
#   - CORS_ALLOWED_ORIGINS    https://<your-netlify-site>.netlify.app  (or CLIENT_URL)
#   - APP_URL                 https://<your-netlify-site>.netlify.app
#   - ENABLE_DEVMODE=false    keep development mode disabled in production

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npx prisma generate"

[deploy]
startCommand = "npm run start:backend"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
